name: Deploy to LWS Server via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'web50.lws-hosting.com' }}
          username: ${{ secrets.FTP_USERNAME || 'c2802936c' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          protocol: ftp
          security: loose
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            README.md
            *.docx
            *.pdf
            .github/**
